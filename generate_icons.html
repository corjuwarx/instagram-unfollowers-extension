<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #fff; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c128" width="128" height="128"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c16" width="16" height="16"></canvas>
<script>
function drawIcon(canvas, size) {
  const ctx = canvas.getContext('2d');
  const r = size * 0.22; // corner radius

  // Background: black rounded square
  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();

  // Instagram-style ring (white)
  const cx = size / 2;
  const cy = size / 2;
  const ringR = size * 0.32;
  const ringW = size * 0.09;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = ringW;
  ctx.beginPath();
  ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
  ctx.stroke();

  // Small dot top-right (Instagram style)
  const dotR = size * 0.07;
  const dotX = cx + size * 0.22;
  const dotY = cy - size * 0.22;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(dotX, dotY, dotR, 0, Math.PI * 2);
  ctx.fill();

  // Diagonal slash (unfollow / remove indicator)
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = ringW;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + size * 0.18, cy - size * 0.18);
  ctx.lineTo(cx + size * 0.38, cy - size * 0.38);
  ctx.stroke();
}

drawIcon(document.getElementById('c128'), 128);
drawIcon(document.getElementById('c48'), 48);
drawIcon(document.getElementById('c16'), 16);

// Download all
['128','48','16'].forEach(s => {
  const canvas = document.getElementById('c' + s);
  const a = document.createElement('a');
  a.download = 'icon' + s + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});
</script>
</body>
</html>
