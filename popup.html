<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unfollowers</title>
    <link rel="stylesheet" href="popup.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="container">

      <header>
        <div class="logo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
          <span>Unfollowers</span>
        </div>
        <nav class="tab-nav hidden" id="tabNav">
          <button class="tab-btn active" id="tabResults">Results</button>
          <button class="tab-btn" id="tabWhitelist">Whitelist</button>
        </nav>
      </header>

      <!-- INITIAL STATE -->
      <div id="initialState" class="state">
        <div class="hero-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
        <h2>Find Non-Followers</h2>
        <p>Detect accounts that don't follow you back.</p>
        <button id="startScanBtn" class="btn btn-primary">Start Scan</button>
      </div>

      <!-- SCANNING STATE -->
      <div id="scanningState" class="state hidden">
        <div class="progress-ring-wrap">
          <svg class="progress-ring" viewBox="0 0 80 80">
            <circle class="ring-bg" cx="40" cy="40" r="34"/>
            <circle id="progressCircle" class="ring-fg" cx="40" cy="40" r="34"/>
          </svg>
          <span id="percentage" class="ring-label">0%</span>
        </div>
        <p id="scanDetails" class="scan-detail">Starting...</p>
        <button id="stopScanBtn" class="btn btn-ghost">Stop</button>
      </div>

      <!-- RESULTS STATE -->
      <div id="resultsState" class="state hidden">
        <div class="results-header">
          <div class="count-badge">
            <span id="unfollowerCount">0</span>
            <small>not following back</small>
          </div>
          <div class="results-actions-top">
            <button id="selectAllBtn" class="btn-link">All</button>
            <span class="divider">·</span>
            <button id="deselectAllBtn" class="btn-link">None</button>
          </div>
        </div>
        <div class="list" id="unfollowerList"></div>
        <div class="results-footer">
          <button id="unfollowSelectedBtn" class="btn btn-primary">Unfollow Selected</button>
          <button id="restartBtn" class="btn btn-ghost">New Scan</button>
        </div>
      </div>

      <!-- WHITELIST STATE -->
      <div id="whitelistState" class="state hidden">
        <div class="results-header">
          <div class="count-badge">
            <span id="whitelistCount">0</span>
            <small>whitelisted</small>
          </div>
        </div>
        <div class="list" id="whitelistList"></div>
        <div class="results-footer">
          <button id="clearWhitelistBtn" class="btn btn-ghost">Clear All</button>
        </div>
      </div>

    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="popup.js"></script>
  </body>
</html>
